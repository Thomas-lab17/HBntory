# HBntory — full stack.
#   client_web (public chat)   :8080
#   backoffice-web (admin UI)  :8081
#   api (backoffice API)       :5000
#   ai (query service)         :8100
#   product-mcp (MCP bridge)   :8002
#   external-products-api      :5001
services:
  external-products-api:
    build: ./hbntory-products-api-main
    environment:
      HBN_PRODUCTS_PORT: "5000"
      HBN_PRODUCTS_LATENCY_MS: "0"
    ports:
      - "5001:5000"

  product-mcp:
    build: ./product_mcp_server
    environment:
      PRODUCT_API_URL: http://external-products-api:5000
    depends_on:
      - external-products-api
    ports:
      - "8002:8002"

  api:
    build: ./api
    environment:
      MCP_SERVER_URL: http://product-mcp:8002
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-dev-service-key}
      DATABASE_URL: sqlite:////data/hbntory.db
    volumes:
      - backoffice-data:/data
    depends_on:
      - product-mcp
    ports:
      - "5000:5000"

  backoffice-web:
    image: nginx:alpine
    volumes:
      - ./backoffice/frontend:/usr/share/nginx/html:ro
      - ./backoffice/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    ports:
      - "8081:80"

  ai:
    build: ./ai_service
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.6-27b}
      MCP_SERVER_URL: http://product-mcp:8002
      BACKOFFICE_API_URL: http://api:5000
      SERVICE_API_KEY: ${SERVICE_API_KEY:-dev-service-key}
    depends_on:
      - product-mcp
      - api
    ports:
      - "8100:8100"

  client_web:
    image: nginx:alpine
    volumes:
      - ./client_web:/usr/share/nginx/html:ro
    ports:
      - "8080:80"

volumes:
  backoffice-data:

services:
  backoffice:
    build:
      context: ./backoffice
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: change-me-in-production
  web_client:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./web_client:/usr/share/nginx/html:ro

services:
  external-products-api:
    build: ./hbntory-products-api
    environment:
      HBN_PRODUCTS_PORT: "5000"
      HBN_PRODUCTS_LATENCY_MS: "0"
    ports:
      - "${PRODUCT_API_PORT:-5001}:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hbntory}
      POSTGRES_USER: ${POSTGRES_USER:-hbntory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backoffice:
    build: ./backoffice
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hbntory}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-hbntory}
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-30}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin123!}
      DEMO_COMMON_PASSWORD: ${DEMO_COMMON_PASSWORD:-Test1234!}
      PRODUCT_API_URL: ${PRODUCT_API_URL:-http://external-products-api:5000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
    depends_on:
      postgres:
        condition: service_healthy
      external-products-api:
        condition: service_healthy
    ports:
      - "${BACKOFFICE_PORT:-8000}:8000"
    restart: unless-stopped

  ai-service:
    build: ./ai_service
    environment:
      APP_ENV: ${APP_ENV:-development}
      AGENT_DATA_CLIENT: ${AGENT_DATA_CLIENT:-http}
      STOCK_API_URL: http://backoffice:8000
      AUTH_API_URL: http://backoffice:8000
      PRODUCT_MCP_URL: http://product-mcp:8002
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      AI_LLM_ENABLED: ${AI_LLM_ENABLED:-true}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://ollama:11434}
      MODEL_NAME: ${MODEL_NAME:-gemma3:1b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
    depends_on:
      backoffice:
        condition: service_started
      product-mcp:
        condition: service_started
      ollama-warmup:
        condition: service_completed_successfully
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-512}
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ollama-model:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${MODEL_NAME:-gemma3:1b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  ollama-warmup:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    command:
      [
        "run",
        "${MODEL_NAME:-gemma3:1b}",
        "Réponds uniquement avec le mot OK.",
      ]
    depends_on:
      ollama-model:
        condition: service_completed_successfully
    restart: "no"

  product-mcp:
    build: ./product_mcp_server
    environment:
      APP_ENV: ${APP_ENV:-development}
      PRODUCT_API_URL: ${PRODUCT_API_URL:-http://external-products-api:5000}
      PRODUCT_API_BASE_URL: ${PRODUCT_API_URL:-http://external-products-api:5000}
    depends_on:
      external-products-api:
        condition: service_healthy
    ports:
      - "${PRODUCT_MCP_PORT:-8002}:8002"
    restart: unless-stopped

  client-web:
    build: ./client_web
    depends_on:
      - ai-service
    ports:
      - "${CLIENT_WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  ollama_data:
  postgres_data:

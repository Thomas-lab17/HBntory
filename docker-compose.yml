services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hbntory}
      POSTGRES_USER: ${POSTGRES_USER:-hbntory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backoffice:
    build: ./backoffice
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hbntory}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-hbntory}
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKOFFICE_PORT:-8000}:8000"
    restart: unless-stopped

  ai-service:
    build: ./ai_service
    environment:
      APP_ENV: ${APP_ENV:-development}
      STOCK_API_URL: http://backoffice:8000
      PRODUCT_MCP_URL: http://product-mcp:8002
    depends_on:
      backoffice:
        condition: service_started
      product-mcp:
        condition: service_started
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    restart: unless-stopped

  product-mcp:
    build: ./product_mcp_server
    environment:
      APP_ENV: ${APP_ENV:-development}
      PRODUCT_API_URL: ${PRODUCT_API_URL:-}
    ports:
      - "${PRODUCT_MCP_PORT:-8002}:8002"
    restart: unless-stopped

  client-web:
    build: ./client_web
    depends_on:
      ai-service:
        condition: service_started
    ports:
      - "${CLIENT_WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  postgres_data:

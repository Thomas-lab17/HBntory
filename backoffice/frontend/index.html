<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>HBntory – Connexion</title>
  <link rel="stylesheet" href="/css/style.css?v=backoffice-3">
</head>
<body class="auth-body">
  <main class="login-page">
    <div class="brand-lockup" aria-label="HBntory">
      <span class="brand-mark" aria-hidden="true">H</span>
      <h1>HBntory</h1>
      <p>Gestion de stock multi-agences</p>
    </div>

    <section class="panel login-card" aria-labelledby="login-title">
      <h2 id="login-title">Connexion</h2>
      <div id="error-message" class="alert alert-error" role="alert" hidden></div>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="username">Nom d’utilisateur</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Votre identifiant"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary">
          <span>Se connecter</span>
        </button>
      </form>
    </section>
  </main>

  <script src="/js/auth.js?v=backoffice-3"></script>
</body>
</html>

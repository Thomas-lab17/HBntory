<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Utilisateurs – HBntory</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-body">
  <aside class="sidebar">
    <a class="sidebar-brand" href="/users.html" aria-label="HBntory">
      <span class="brand-mark brand-mark-small" aria-hidden="true">◇</span>
      <strong>HB<span>ntory</span></strong>
    </a>

    <nav class="sidebar-nav" aria-label="Navigation principale">
      <a class="nav-item is-active" href="/users.html">
        <span aria-hidden="true">♙</span> Utilisateurs
      </a>
    </nav>

    <div class="sidebar-footer">
      <p class="nav-section-label">ADMIN</p>
      <button id="logout-btn" class="nav-item logout-button" type="button">
        <span aria-hidden="true">↪</span> Déconnexion
      </button>
      <div class="user-card">
        <span id="user-initials" class="avatar">—</span>
        <div>
          <strong id="user-name">Chargement…</strong>
          <span>Administrateur</span>
        </div>
      </div>
    </div>
  </aside>

  <div class="app-shell">
    <header class="topbar">
      <div class="breadcrumb"><span>HBntory</span> › <strong>Utilisateurs</strong></div>
      <div class="session-state"><i></i> Session active</div>
    </header>

    <main class="page-content">
      <div id="error-message" class="alert alert-error" role="alert" hidden></div>
      <div id="success-message" class="alert alert-success" role="status" hidden></div>

      <div class="page-heading">
        <div>
          <h1>Utilisateurs</h1>
          <p id="users-count">Chargement…</p>
        </div>
        <button id="open-create-modal" class="btn btn-primary btn-auto" type="button">
          + Nouvel utilisateur
        </button>
      </div>

      <div class="toolbar">
        <label class="search-field">
          <span class="sr-only">Rechercher un utilisateur</span>
          <span aria-hidden="true">⌕</span>
          <input id="users-search" type="search" placeholder="Rechercher un utilisateur…">
        </label>
      </div>

      <div class="panel table-panel">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Utilisateur</th>
                <th>Rôle</th>
                <th>Agence</th>
                <th class="align-right">Actions</th>
              </tr>
            </thead>
            <tbody id="users-table-body">
              <tr><td colspan="4" class="empty-state">Chargement des utilisateurs…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <dialog id="create-user-dialog" class="modal">
    <form id="create-user-form" class="modal-card">
      <div class="modal-heading">
        <div>
          <span class="eyebrow">Compte common</span>
          <h2>Nouvel utilisateur</h2>
        </div>
        <button id="close-create-modal" class="icon-button" type="button" aria-label="Fermer">×</button>
      </div>

      <div class="form-group">
        <label for="new-username">Nom d’utilisateur</label>
        <input type="text" id="new-username" autocomplete="off" required>
      </div>
      <div class="form-group">
        <label for="new-password">Mot de passe</label>
        <input type="password" id="new-password" autocomplete="new-password" required>
      </div>
      <div class="form-group">
        <label for="new-branch-id">Identifiant de l’agence</label>
        <input type="number" id="new-branch-id" min="1" step="1" required>
        <small>L’API actuelle ne fournit pas de liste d’agences.</small>
      </div>
      <div class="modal-actions">
        <button id="cancel-create-modal" class="btn btn-secondary btn-auto" type="button">Annuler</button>
        <button class="btn btn-primary btn-auto" type="submit">Créer</button>
      </div>
    </form>
  </dialog>

  <dialog id="user-action-dialog" class="modal">
    <form id="user-action-form" class="modal-card">
      <div class="modal-heading">
        <div>
          <span id="user-action-eyebrow" class="eyebrow">Utilisateur</span>
          <h2 id="user-action-title">Modifier</h2>
        </div>
        <button id="close-user-action-modal" class="icon-button" type="button" aria-label="Fermer">×</button>
      </div>
      <input id="action-user-id" type="hidden">
      <input id="action-user-mode" type="hidden">
      <div id="password-action-field" class="form-group" hidden>
        <label for="action-password">Nouveau mot de passe</label>
        <input id="action-password" type="password" autocomplete="new-password">
      </div>
      <div id="branch-action-field" class="form-group" hidden>
        <label for="action-branch-id">Identifiant de l’agence</label>
        <input id="action-branch-id" type="number" min="1" step="1">
      </div>
      <div class="modal-actions">
        <button id="cancel-user-action-modal" class="btn btn-secondary btn-auto" type="button">Annuler</button>
        <button id="submit-user-action" class="btn btn-primary btn-auto" type="submit">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <script src="/js/users.js?v=figma-front-1"></script>
</body>
</html>
